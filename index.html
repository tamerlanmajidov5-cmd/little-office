    const members=root.officeState.workers.filter(w=&gt;session.names.includes(w.name));
    if(!members.length){session=null;sync();return;}
    const kind=session.kind;
    const arrived=members.filter(w=&gt;[&#x27;sofa&#x27;,&#x27;read&#x27;,&#x27;snack&#x27;].includes(kind)?w.activity===kind&amp;&amp;w.seated:(w.visits[kind]||0)&gt;session.visits[w.name]).length;
    const action={sofa:&#x27;settling onto the sofa&#x27;,read:&#x27;finding their reading seats&#x27;,coffee:&#x27;collecting coffee in turn&#x27;,snack:&#x27;choosing fruit and finding a sofa seat&#x27;,water:&#x27;taking turns caring for the plants&#x27;}[kind];
    message(kinds[kind]+&#x27; · &#x27;+(arrived===members.length?(kind===&#x27;sofa&#x27;?&#x27;Everyone is comfortable. Tell the team a story.&#x27;:kind===&#x27;read&#x27;?&#x27;Everyone has a book. Open the bookshelf or a story adventure.&#x27;:kind===&#x27;coffee&#x27;?&#x27;Everyone has enjoyed a cup.&#x27;:kind===&#x27;snack&#x27;?&#x27;Everyone has fruit and a sofa seat. Enjoy a story together.&#x27;:&#x27;Everyone has helped the plants.&#x27;):`${arrived} of ${members.length} ready · ${action}.`));
    if(arrived===members.length&amp;&amp;[&#x27;coffee&#x27;,&#x27;water&#x27;].includes(kind)&amp;&amp;members.every(w=&gt;w.activity!==kind&amp;&amp;!w.queuedAction&amp;&amp;!w.intent.startsWith(kind))){session=null;sync();}
  }
  function windowScene(ctx,x,y,w,h,p,time,reduced){
    const t=reduced?0:time;
    ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
    const grad=ctx.createLinearGradient(0,y,0,y+h);
    grad.addColorStop(0,setting===&#x27;night&#x27;?p.screen:setting===&#x27;rain&#x27;?p.blue:setting===&#x27;sunset&#x27;?p.pink:p.water);
    grad.addColorStop(1,setting===&#x27;night&#x27;?p.blue:setting===&#x27;sunset&#x27;?p.orange:p.window);
    ctx.fillStyle=grad;ctx.fillRect(x,y,w,h);
    const disk=(dx,dy,r,color)=&gt;{ctx.fillStyle=color;ctx.beginPath();ctx.arc(x+dx,y+dy,r,0,Math.PI*2);ctx.fill();};
    if(setting===&#x27;night&#x27;){
      for(let i=0;i&lt;15;i++){ctx.globalAlpha=.55+(i%3)*.2;disk((i*29+8)%w,(i*13+3)%(h*.66),i%4===0?1.2:.65,p.paper);}
      ctx.globalAlpha=1;disk(w*.76,h*.29,8,p.paper);disk(w*.79,h*.25,7,p.screen);
    }else if(setting!==&#x27;rain&#x27;){
      const sunX=setting===&#x27;sunset&#x27;?w*.72:w*.25,sunY=setting===&#x27;sunset&#x27;?h*.61:h*.29;
      ctx.globalAlpha=.16;disk(sunX,sunY,18,p.paper);ctx.globalAlpha=1;disk(sunX,sunY,8,p.paper);
    }
    for(let i=0;i&lt;3&amp;&amp;setting!==&#x27;night&#x27;;i++){
      const cx=x+((i*39+t*(setting===&#x27;rain&#x27;?3:1.8))%(w+35))-15,cy=y+13+i*10;
      ctx.globalAlpha=setting===&#x27;rain&#x27;?.6:.5;ctx.fillStyle=setting===&#x27;rain&#x27;?p.screen:p.paper;
      ctx.beginPath();ctx.ellipse(cx,cy,17,4,0,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    for(let layer=0;layer&lt;2;layer++){
      ctx.fillStyle=layer?p.leafDark:p.sofa;ctx.beginPath();ctx.moveTo(x,y+h);
      for(let j=0;j&lt;=8;j++)ctx.lineTo(x+j*w/8,y+h*(layer?.8:.64)-Math.sin(j*1.7+layer)*8);
      ctx.lineTo(x+w,y+h);ctx.closePath();ctx.fill();
    }
    if(setting===&#x27;rain&#x27;){
      ctx.strokeStyle=p.paper;ctx.lineWidth=.8;ctx.globalAlpha=.65;
      for(let i=0;i&lt;24;i++){const dx=x+(i*23.3)%w,dy=y+(i*17+t*55)%(h+10)-10;ctx.beginPath();ctx.moveTo(dx,dy);ctx.lineTo(dx-3,dy+8);ctx.stroke();}
    }
    ctx.restore();
  }
  function drawRoom(ctx,w,h,p,time,reduced){
    ctx.save();
    // An analog wall clock and a small calendar fit between the gallery and window.
    const x=w*.706,y=86;ctx.fillStyle=p.leg;ctx.beginPath();ctx.arc(x,y,19,0,Math.PI*2);ctx.fill();ctx.fillStyle=p.paper;ctx.beginPath();ctx.arc(x,y,16,0,Math.PI*2);ctx.fill();
    const now=new Date(),minute=now.getMinutes(),hour=now.getHours()%12;
    ctx.strokeStyle=p.bubbleInk;ctx.lineWidth=1.7;
    for(const [angle,len] of [[(hour+minute/60)*Math.PI/6,8],[minute*Math.PI/30,12]]){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.sin(angle)*len,y-Math.cos(angle)*len);ctx.stroke();}
    for(let i=0;i&lt;12;i++){const angle=i*Math.PI/6;ctx.beginPath();ctx.moveTo(x+Math.sin(angle)*13,y-Math.cos(angle)*13);ctx.lineTo(x+Math.sin(angle)*14,y-Math.cos(angle)*14);ctx.stroke();}
    ctx.fillStyle=p.deskFront;ctx.fillRect(x-12,y+25,24,22);ctx.fillStyle=p.orange;ctx.fillRect(x-12,y+25,24,5);ctx.fillStyle=p.paper;
    for(let row=0;row&lt;2;row++)for(let col=0;col&lt;4;col++)ctx.fillRect(x-8+col*5,y+34+row*6,3,3);
    // Warm light falls on the floor without obscuring faces or furniture.
    if(setting===&#x27;sunset&#x27;){
      const glow=ctx.createRadialGradient(w*.78,h*.36,2,w*.78,h*.36,w*.43);glow.addColorStop(0,p.orange);glow.addColorStop(1,p.bg);
      ctx.globalAlpha=.065;ctx.fillStyle=glow;ctx.fillRect(40,155,w-75,h-179);
    }
    if(light){
      ctx.globalAlpha=setting===&#x27;night&#x27;?.10:.05;ctx.fillStyle=p.orange;ctx.beginPath();ctx.ellipse(w*.25,h*.87,w*.18,32,-.07,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
  weather.addEventListener(&#x27;change&#x27;,()=&gt;{setting=weather.value;save();root.dataset.atmosphere=setting;refresh();});
  lamp.addEventListener(&#x27;change&#x27;,()=&gt;{light=lamp.checked;save();refresh();});
  $(&#x27;.office-shared-start&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;start());
  $(&#x27;.office-shared-end&#x27;).addEventListener(&#x27;click&#x27;,endBreak);
  root.addEventListener(&#x27;office-manual-control&#x27;,()=&gt;{if(session){session=null;message(&#x27;You are controlling the workers. The gathering has ended.&#x27;);sync();}});
  root.officeAtmosphere={windowScene,drawRoom,sync,start,endBreak,get state(){return {setting,light,session:session?{kind:session.kind,names:[...session.names]}:null};}};
  root.dataset.atmosphere=setting;sync();refresh();
})();

&lt;script data-office-adventure-engine&gt;
(() =&gt; {
  const root=document.getElementById(&#x27;little-office-v4&#x27;);
  if(!root?.officeConversation||!root.querySelector(&#x27;.office-adventure&#x27;))return;
  const $=s=&gt;root.querySelector(s),chat=root.officeConversation;
  const allNames=[&#x27;Milo&#x27;,&#x27;Ava&#x27;,&#x27;Noah&#x27;,&#x27;Luna&#x27;,&#x27;Leo&#x27;];
  const roster=()=&gt;root.officeState.workers.map(worker=&gt;worker.name);
  const active=()=&gt;[&#x27;demo&#x27;,&#x27;sending&#x27;,&#x27;working&#x27;,&#x27;paused&#x27;,&#x27;waiting&#x27;].includes(root.officeState.phase);
  const blocked=()=&gt;active()||root.officeState.pending&gt;0||chat.state.busy||chat.state.awaiting;
  const storageKey=&#x27;little-office-lantern-library-v1&#x27;;
  const items={thread:&#x27;golden thread&#x27;,shell:&#x27;listening shell&#x27;,ribbon:&#x27;wind ribbon&#x27;,star:&#x27;star chart&#x27;,key:&#x27;brass key&#x27;,compass:&#x27;ink compass&#x27;,seed:&#x27;moon seed&#x27;,feather:&#x27;paper feather&#x27;,lens:&#x27;mended lens&#x27;,tea:&#x27;flask of tea&#x27;,page:&#x27;remembered page&#x27;,chalk:&#x27;silver chalk&#x27;,harmony:&#x27;three-note melody&#x27;};
  const chapters=[&#x27;An invitation after rain&#x27;,&#x27;Rooms that remember&#x27;,&#x27;The keeper of lost tales&#x27;,&#x27;The light you choose&#x27;,&#x27;A new page&#x27;];
  const scenes={
    invitation:{chapter:0,title:&#x27;A knock at the window&#x27;,text:[&#x27;A paper fox taps the office window. In its mouth is an envelope addressed to “Anyone with a story worth sharing.” Inside, a tiny lantern has gone dark.&#x27;,&#x27;“The Lantern Library has lost its light,” the letter says. “Please come before the last page turns.” The whole team looks at you. Outside, one path winds through the rain garden; another climbs to a rooftop tram.&#x27;],advice:[&#x27;I vote for following the fox. It came all this way to find us.&#x27;,&#x27;A tram sounds cozy, but I want to know where the fox lives.&#x27;,&#x27;Let’s choose a route. Both should lead to the library.&#x27;,&#x27;The rain garden might have somebody who needs our help.&#x27;,&#x27;I brought an imaginary snack. That makes this an official expedition.&#x27;],choices:[{id:&#x27;garden&#x27;,label:&#x27;Follow the fox through the rain garden&#x27;,hint:&#x27;A quieter path, with a small mystery.&#x27;,to:&#x27;rainpath&#x27;},{id:&#x27;tram&#x27;,label:&#x27;Ride the rooftop tram&#x27;,hint:&#x27;See the city from above.&#x27;,to:&#x27;rooftop&#x27;}]},
    rainpath:{chapter:0,title:&#x27;The fox and the bridge&#x27;,text:[&#x27;The fox stops beside a puddle large enough to reflect the whole moon. Its paper tail is caught on a broken bridge. Across the water, the library windows blink like sleepy eyes.&#x27;,&#x27;You could untangle the fox, or take the stepping stones and call for help from the other bank.&#x27;],advice:[&#x27;That tail is our first puzzle. I’ll hold the bridge steady.&#x27;,&#x27;Let’s be gentle. Paper can tear when it is wet.&#x27;,&#x27;The stepping stones are close enough to cross carefully.&#x27;,&#x27;I’d help the fox before we hurry on.&#x27;,&#x27;If we take the stones, I’ll count them. Counting is less slippery than dancing.&#x27;],choices:[{id:&#x27;helpfox&#x27;,label:&#x27;Carefully untangle the fox&#x27;,hint:&#x27;Stay together and repair the bridge.&#x27;,to:&#x27;foxbridge&#x27;},{id:&#x27;stones&#x27;,label:&#x27;Cross by the stepping stones&#x27;,hint:&#x27;Find another way to help from the far bank.&#x27;,to:&#x27;river&#x27;}]},
    foxbridge:{chapter:0,title:&#x27;A thread for the journey&#x27;,text:[&#x27;You free the tail. Ava folds a new bridge hinge, and Noah holds it while you tie everything in place. The fox shakes itself into a splendid, slightly crumpled bow.&#x27;,&#x27;It gives you a length of golden thread. “This joins things that belong together,” it says. “Even people who have forgotten how to meet.”&#x27;],advice:[&#x27;We have a bridge and a friend. Good first chapter.&#x27;,&#x27;Keep that thread dry. I think its promise matters.&#x27;,&#x27;The library door is just ahead.&#x27;,&#x27;Helping changed the path. I like that.&#x27;,&#x27;I’m glad the fox can wag its tail again.&#x27;],choices:[{id:&#x27;thread&#x27;,label:&#x27;Pocket the golden thread and head to the library&#x27;,to:&#x27;gate&#x27;,give:[&#x27;thread&#x27;]}]},
    river:{chapter:0,title:&#x27;A shell full of voices&#x27;,text:[&#x27;On the far bank, Leo finds a lever that lowers the bridge. The fox trots across and drops a blue shell into your hand. When you lift it to your ear, you hear pages turning instead of waves.&#x27;,&#x27;“A listening shell,” the fox explains. “It hears the words people are too shy to say.”&#x27;],advice:[&#x27;We found a different way to help.&#x27;,&#x27;Listen before guessing what someone needs.&#x27;,&#x27;A bridge lever is much better than wet shoes.&#x27;,&#x27;That shell might be useful in a quiet room.&#x27;,&#x27;For the record, I only slipped a tiny bit.&#x27;],choices:[{id:&#x27;shell&#x27;,label:&#x27;Take the listening shell to the library gate&#x27;,to:&#x27;gate&#x27;,give:[&#x27;shell&#x27;]}]},
    rooftop:{chapter:0,title:&#x27;The tram above the chimneys&#x27;,text:[&#x27;The rooftop tram glides past laundry lines and sleeping weather vanes. At the last stop, a windsock is tangled around the tram bell. Nearby, a little observatory has left its door open.&#x27;,&#x27;The library is below you. There is time for one small detour.&#x27;],advice:[&#x27;That bell cannot ring while the windsock is stuck.&#x27;,&#x27;Someone left a light on in the observatory.&#x27;,&#x27;I could help untangle the bell rope.&#x27;,&#x27;The stars might show us something we cannot see from the street.&#x27;,&#x27;One detour. I will resist making it seventeen.&#x27;],choices:[{id:&#x27;windsock&#x27;,label:&#x27;Free the windsock from the bell&#x27;,hint:&#x27;Help the next travelers find their stop.&#x27;,to:&#x27;weather&#x27;},{id:&#x27;stars&#x27;,label:&#x27;Step inside the observatory&#x27;,hint:&#x27;Look for a route among the stars.&#x27;,to:&#x27;observatory&#x27;}]},
    weather:{chapter:0,title:&#x27;A ribbon that remembers the wind&#x27;,text:[&#x27;Milo steadies the ladder while you unhook the windsock. The tram bell rings a warm, round note. From the windsock falls a ribbon that keeps floating even when the air is still.&#x27;,&#x27;A little brass label reads: “Tie this somewhere lonely. A friendly breeze will find its way there.”&#x27;],advice:[&#x27;A ribbon for lonely places. We should keep it.&#x27;,&#x27;That bell sounds like a welcome.&#x27;,&#x27;The library stairs are below the tram platform.&#x27;,&#x27;A breeze can carry seeds and songs.&#x27;,&#x27;And, apparently, my hat. Come back, hat.&#x27;],choices:[{id:&#x27;ribbon&#x27;,label:&#x27;Carry the wind ribbon down to the library&#x27;,to:&#x27;gate&#x27;,give:[&#x27;ribbon&#x27;]}]},
    observatory:{chapter:0,title:&#x27;The unfinished constellation&#x27;,text:[&#x27;An astronomer has fallen asleep over a map of the night. Five stars have been joined with pencil lines. There is a gap where a sixth should be.&#x27;,&#x27;When you hold the dark lantern above the map, a new star appears. The astronomer smiles in her sleep and slides the chart toward you. A dotted road now leads to the library.&#x27;],advice:[&#x27;That empty space was waiting for someone to arrive.&#x27;,&#x27;Let’s leave the astronomer a thank-you note.&#x27;,&#x27;The chart shows roads as well as stars. Useful.&#x27;,&#x27;Perhaps stories can make new constellations.&#x27;,&#x27;Six stars: five of us, and you. I like this map.&#x27;],choices:[{id:&#x27;star&#x27;,label:&#x27;Follow the star chart to the library&#x27;,to:&#x27;gate&#x27;,give:[&#x27;star&#x27;]}]},
    gate:{chapter:0,title:&#x27;The door with no handle&#x27;,text:[&#x27;The library door has no handle, only a small brass ear. A sign says, “Tell me how you would like to be welcomed.”&#x27;,&#x27;The paper fox sits beside you. The lantern remains dark, but it feels a little warmer.&#x27;],advice:[&#x27;I’d ask for a place at the table.&#x27;,&#x27;A welcome should leave room for everyone.&#x27;,&#x27;The ear is listening. There is no lock to force.&#x27;,&#x27;I’d offer a quiet hello.&#x27;,&#x27;I would appreciate a biscuit, but maybe that is not the password.&#x27;],choices:[{id:&#x27;knock&#x27;,label:&#x27;“Come in. There is room for you.”&#x27;,hint:&#x27;Offer the welcome you would give someone else.&#x27;,to:&#x27;foyer&#x27;,give:[&#x27;key&#x27;]},{id:&#x27;listen&#x27;,label:&#x27;Wait quietly and listen to the door&#x27;,hint:&#x27;Let the library welcome you in its own way.&#x27;,to:&#x27;foyer&#x27;}]},
    foyer:{chapter:1,title:&#x27;A library without a last page&#x27;,text:[&#x27;The door opens. A brass key hangs from a ribbon inside, though the door was never locked. Shelves climb so high that clouds drift between their tops.&#x27;,&#x27;Two passageways glow faintly. One leads to the Map Room, where rivers run across paper. The other leads to a conservatory full of sleeping plants.&#x27;],advice:[&#x27;Maps usually mean adventure. That is my vote.&#x27;,&#x27;Plants could use a visitor too.&#x27;,&#x27;We can only carry one discovery from this part of the library.&#x27;,&#x27;A conservatory! I would love to see what grows in moonlight.&#x27;,&#x27;I promise not to fold any important maps into airplanes.&#x27;],choices:[{id:&#x27;maproom&#x27;,label:&#x27;Explore the Map Room&#x27;,hint:&#x27;Find something that points toward new journeys.&#x27;,to:&#x27;maproom&#x27;},{id:&#x27;conservatory&#x27;,label:&#x27;Visit the moonlit conservatory&#x27;,hint:&#x27;Look for something that helps stories grow.&#x27;,to:&#x27;conservatory&#x27;}]},
    maproom:{chapter:1,title:&#x27;The atlas that spilled&#x27;,text:[&#x27;An atlas has spilled its ocean onto the floor. Tiny ships drift between the table legs. On a shelf, a flock of paper birds keeps trying to put the pages back in the wrong order.&#x27;,&#x27;Across the ink sea, a lighthouse flashes a patient signal.&#x27;],advice:[&#x27;That lighthouse seems to be calling us.&#x27;,&#x27;The birds look overwhelmed. Perhaps they need a calm pair of hands.&#x27;,&#x27;A folded page would make a good boat.&#x27;,&#x27;There are two ways to help here. Choose the one you are curious about.&#x27;,&#x27;I can be a very small captain.&#x27;],choices:[{id:&#x27;harbor&#x27;,label:&#x27;Sail a folded page to the ink lighthouse&#x27;,hint:&#x27;Search for a guide to places you have not been.&#x27;,to:&#x27;inkharbor&#x27;},{id:&#x27;birds&#x27;,label:&#x27;Help the paper birds sort their pages&#x27;,hint:&#x27;Give an unfinished story somewhere to begin.&#x27;,to:&#x27;paperbirds&#x27;}]},
    conservatory:{chapter:1,title:&#x27;The greenhouse of almost-stories&#x27;,text:[&#x27;The conservatory is full of plants with blank paper leaves. One has a tiny moon caught between its roots. Above it, paper birds shuffle loose pages from branch to branch.&#x27;,&#x27;A watering can waits beside a well. Its label says, “For ideas that have not learned to grow yet.”&#x27;],advice:[&#x27;A moon under the roots is definitely worth investigating.&#x27;,&#x27;I could hold the loose pages while we help the birds.&#x27;,&#x27;The watering can is empty. The well must be nearby.&#x27;,&#x27;I want to wake that little moon seed.&#x27;,&#x27;Do paper trees drop bookmarks in autumn?&#x27;],choices:[{id:&#x27;well&#x27;,label:&#x27;Water the plant above the tiny moon&#x27;,hint:&#x27;Nurture a seed for a future garden.&#x27;,to:&#x27;rootwell&#x27;},{id:&#x27;birds&#x27;,label:&#x27;Make a nest for the paper birds&#x27;,hint:&#x27;Help their scattered pages become a story.&#x27;,to:&#x27;paperbirds&#x27;}]},
    inkharbor:{chapter:1,title:&#x27;The lighthouse in a puddle&#x27;,text:[&#x27;Your folded boat arrives at a lighthouse no bigger than a coffee mug. Its keeper is a comma wearing a raincoat. “I keep stories from running together,” it says.&#x27;,&#x27;You help turn its lamp toward a stranded ship. In thanks, the comma gives you an ink compass. Its needle points toward the story you have not heard yet.&#x27;],advice:[&#x27;An unknown story is a wonderful direction.&#x27;,&#x27;The comma needed help before it could guide anyone else.&#x27;,&#x27;Put the compass in the satchel. We may need it later.&#x27;,&#x27;The stranded ship is moving again.&#x27;,&#x27;A comma in a raincoat. I shall never read punctuation the same way.&#x27;],choices:[{id:&#x27;compass&#x27;,label:&#x27;Take the ink compass into the whispering hall&#x27;,to:&#x27;whisperhall&#x27;,give:[&#x27;compass&#x27;]}]},
    rootwell:{chapter:1,title:&#x27;A pocket-sized moon&#x27;,text:[&#x27;You water the roots. A pale seed rises from the soil and opens one sleepy eye. It is warm, like a pebble that has held the sun all day.&#x27;,&#x27;“Plant me where stories are shared,” it murmurs. “I will grow a place where people can stay a little longer.” Luna folds a leaf around it for the journey.&#x27;],advice:[&#x27;We could make a story garden with this.&#x27;,&#x27;A place to stay sounds just as valuable as a place to go.&#x27;,&#x27;The leaf will protect it until we find good soil.&#x27;,&#x27;I will help you plant it when the moment is right.&#x27;,&#x27;I promise not to mistake it for a snack.&#x27;],choices:[{id:&#x27;seed&#x27;,label:&#x27;Carry the moon seed into the whispering hall&#x27;,to:&#x27;whisperhall&#x27;,give:[&#x27;seed&#x27;]}]},
    paperbirds:{chapter:1,title:&#x27;A nest made of beginnings&#x27;,text:[&#x27;Instead of forcing the pages into a single order, you let each bird choose one. Together they build a nest out of “Once,” “Perhaps,” and “What if.”&#x27;,&#x27;One bird offers a feather made of blank paper. Whatever grows beneath it will remember that every ending can become another beginning.&#x27;],advice:[&#x27;We did not have to decide the whole story for them.&#x27;,&#x27;A blank page can be an invitation.&#x27;,&#x27;That feather could shelter something new.&#x27;,&#x27;It might help a garden take root later.&#x27;,&#x27;The bird says thank you. At least, that is how I interpret that dramatic bow.&#x27;],choices:[{id:&#x27;feather&#x27;,label:&#x27;Take the paper feather into the whispering hall&#x27;,to:&#x27;whisperhall&#x27;,give:[&#x27;feather&#x27;]}]},
    whisperhall:{chapter:2,title:&#x27;The words between the shelves&#x27;,text:[&#x27;The hall whispers with unfinished sentences: “I meant to say…” “If only I had asked…” At the far end, a small keeper is sweeping letters into a dustpan.&#x27;,&#x27;A tall staircase leads behind the keeper. There is a sign on its lowest step: “The fastest way is not always the shortest.”&#x27;],advice:[&#x27;We should ask the keeper what happened to the light.&#x27;,&#x27;Those unfinished sentences sound lonely. I want to listen.&#x27;,&#x27;The staircase goes to the same landing. We can choose either route.&#x27;,&#x27;A quiet pause might tell us more than rushing ahead.&#x27;,&#x27;For once, I vote against racing up all those stairs.&#x27;],choices:[{id:&#x27;hear&#x27;,label:&#x27;Listen to the unfinished sentences&#x27;,hint:&#x27;Let the keeper see that you have time.&#x27;,to:&#x27;keeper&#x27;},{id:&#x27;stairs&#x27;,label:&#x27;Take the winding staircase&#x27;,hint:&#x27;Meet the keeper at the landing above.&#x27;,to:&#x27;lanternstairs&#x27;}]},
    lanternstairs:{chapter:2,title:&#x27;A staircase of small memories&#x27;,text:[&#x27;Every step plays a memory: the smell of bread, a birthday candle, a friend saying your name. Near the top, one step is silent.&#x27;,&#x27;You each share a small, invented memory for the empty step: a cloud shaped like a teapot, a dance in a puddle, a garden after rain. The stair glows, and the keeper meets you at the landing.&#x27;],advice:[&#x27;Even an imaginary memory can make a good story.&#x27;,&#x27;The quiet step needed room for something new.&#x27;,&#x27;All the steps are connected now.&#x27;,&#x27;That garden memory is my favorite.&#x27;,&#x27;My puddle dance was extremely dignified.&#x27;],choices:[{id:&#x27;landing&#x27;,label:&#x27;Ask the keeper about the dark lantern&#x27;,to:&#x27;keeper&#x27;}]},
    keeper:{chapter:2,title:&#x27;The keeper’s empty desk&#x27;,text:[&#x27;“The library has not lost its stories,” the keeper explains. “It has forgotten how to share them. I kept waiting until every page was perfect.”&#x27;,&#x27;On the desk are a cracked lantern lens and a box of forgotten names. You have time to help with one before the great bell rings.&#x27;],advice:[&#x27;Let’s fix the lantern so the stories can travel again.&#x27;,&#x27;I am drawn to that box of names. Nobody should be forgotten.&#x27;,&#x27;A cracked lens can be mended without hiding every crack.&#x27;,&#x27;The keeper sounds tired. We can help gently.&#x27;,&#x27;Perfect pages sound exhausting. A shared, slightly wonky story is better.&#x27;],choices:[{id:&#x27;repair&#x27;,label:&#x27;Help in the lantern workshop&#x27;,hint:&#x27;Mend the light, or look after its tired keeper.&#x27;,to:&#x27;workshop&#x27;},{id:&#x27;remember&#x27;,label:&#x27;Open the box of forgotten names&#x27;,hint:&#x27;Give an overlooked story room to return.&#x27;,to:&#x27;archive&#x27;}]},
    workshop:{chapter:2,title:&#x27;The beauty of a mended thing&#x27;,text:[&#x27;The lens has three small cracks. You could join them with luminous glue; the lines would remain visible, like rivers on a map. Beside it, the keeper’s tea has gone cold.&#x27;,&#x27;The keeper watches you, uncertain whether a repair that still shows its scars can be called finished.&#x27;],advice:[&#x27;Mend the lens. The cracks can be part of its design.&#x27;,&#x27;Or sit with the keeper. They have been carrying this alone.&#x27;,&#x27;The lens should work even if the joins remain visible.&#x27;,&#x27;Rest is useful work too.&#x27;,&#x27;I volunteer to test the tea. A very serious responsibility.&#x27;],choices:[{id:&#x27;lens&#x27;,label:&#x27;Mend the lens and keep its silver lines&#x27;,hint:&#x27;Your final lantern will cast little rivers of light.&#x27;,to:&#x27;bell&#x27;,give:[&#x27;lens&#x27;]},{id:&#x27;tea&#x27;,label:&#x27;Share warm tea and a quiet minute&#x27;,hint:&#x27;Carry the keeper’s comforting brew with you.&#x27;,to:&#x27;bell&#x27;,give:[&#x27;tea&#x27;]}]},
    archive:{chapter:2,title:&#x27;The names that almost disappeared&#x27;,text:[&#x27;Inside the box are two kinds of pages: one with a name faded almost to nothing, and a stack that has never been written on.&#x27;,&#x27;A soft voice says, “There is room here for remembering, and room for imagining.” You can restore the faded page or take silver chalk to welcome a new story.&#x27;],advice:[&#x27;Let’s save the name before it fades away.&#x27;,&#x27;I want to find out who has been missing from the story.&#x27;,&#x27;The chalk can write on doors, paths and lantern glass.&#x27;,&#x27;Both choices leave a place for someone.&#x27;,&#x27;A new story might begin with the person standing right beside us.&#x27;],choices:[{id:&#x27;page&#x27;,label:&#x27;Restore the faded name&#x27;,hint:&#x27;The remembered page will appear in your ending.&#x27;,to:&#x27;bell&#x27;,give:[&#x27;page&#x27;]},{id:&#x27;chalk&#x27;,label:&#x27;Take chalk for a story still to come&#x27;,hint:&#x27;You can leave a new invitation in your ending.&#x27;,to:&#x27;bell&#x27;,give:[&#x27;chalk&#x27;]}]},
    bell:{chapter:3,title:&#x27;The bell’s three notes&#x27;,text:[&#x27;The great bell has three keys: moon, leaf and wave. Its inscription reads: “First the light that wakes the seed. Then the seed that sends its roots. Last the water that helps it grow.”&#x27;,&#x27;The keeper smiles. “You can try. A wrong note is simply a place to begin listening again.”&#x27;],advice:[&#x27;The clue begins with light. I think the moon comes first.&#x27;,&#x27;Let’s follow the whole little story in the inscription.&#x27;,&#x27;Light, growing seed, then water. Moon, leaf, wave.&#x27;,&#x27;That is exactly how we cared for the conservatory.&#x27;,&#x27;I was going to play all three at once. Your plan is better.&#x27;],choices:[{id:&#x27;melody&#x27;,label:&#x27;Moon → leaf → wave&#x27;,hint:&#x27;Play the sequence from the inscription.&#x27;,to:&#x27;chamber&#x27;,give:[&#x27;harmony&#x27;]},{id:&#x27;echo&#x27;,label:&#x27;Wave → moon → leaf&#x27;,hint:&#x27;Try a different order and listen to the result.&#x27;,to:&#x27;echo&#x27;}]},
    echo:{chapter:3,title:&#x27;A kindly echo&#x27;,text:[&#x27;The bell gives a cheerful wobble. Nothing breaks. An echo answers slowly: “Light first. Growth next. Water last.”&#x27;,&#x27;You try again together. This time the notes weave into a silver stairway. The keeper laughs softly. “See? The library was never asking you to be perfect.”&#x27;],advice:[&#x27;We can learn the melody together.&#x27;,&#x27;I like a puzzle that leaves room for another try.&#x27;,&#x27;The order is moon, leaf, wave.&#x27;,&#x27;Listen to how the final note settles.&#x27;,&#x27;My wobbly note has contributed greatly to musical history.&#x27;],choices:[{id:&#x27;retrymelody&#x27;,label:&#x27;Play moon → leaf → wave together&#x27;,to:&#x27;chamber&#x27;,give:[&#x27;harmony&#x27;]}]},
    chamber:{chapter:3,title:&#x27;What should a lantern do?&#x27;,text:[&#x27;At the top of the silver stairs, your lantern begins to glow. It has been gathering light from every helpful choice along the way. The keeper opens a window onto the sleeping city.&#x27;,&#x27;“It is yours to share,” they say. “A lantern can guide someone home, grow a meeting place, or light a road no one has taken. What will yours become?”&#x27;],advice:[&#x27;I would carry it toward a new adventure, if we have a way to find one.&#x27;,&#x27;I like the idea of a light that welcomes people home.&#x27;,&#x27;Look in the satchel. Our discoveries open different possibilities.&#x27;,&#x27;A seed or feather could help us grow a story garden.&#x27;,&#x27;A party needs a thread to bring us together, or a breeze to carry the invitation.&#x27;],choices:[{id:&#x27;home&#x27;,label:&#x27;Light the bridge that leads people home&#x27;,hint:&#x27;Make the library a warm welcome.&#x27;,to:&#x27;homeEnding&#x27;},{id:&#x27;garden&#x27;,label:&#x27;Plant a garden where people share stories&#x27;,hint:&#x27;Use your moon seed or paper feather.&#x27;,to:&#x27;gardenEnding&#x27;,any:[&#x27;seed&#x27;,&#x27;feather&#x27;]},{id:&#x27;journey&#x27;,label:&#x27;Open a road to stories still undiscovered&#x27;,hint:&#x27;Follow your ink compass or star chart.&#x27;,to:&#x27;journeyEnding&#x27;,any:[&#x27;compass&#x27;,&#x27;star&#x27;]},{id:&#x27;festival&#x27;,label:&#x27;Invite the whole city to a lantern festival&#x27;,hint:&#x27;Use your golden thread or wind ribbon.&#x27;,to:&#x27;festivalEnding&#x27;,any:[&#x27;thread&#x27;,&#x27;ribbon&#x27;]}]},
    homeEnding:{chapter:4,title:&#x27;The Welcome-Home Lantern&#x27;,ending:&#x27;home&#x27;,text:[&#x27;You hang the lantern above the little bridge. Its light reaches every doorstep, soft enough for tired eyes and bright enough to find the way.&#x27;,&#x27;The keeper opens the library each evening, even when the pages are unfinished. Back in the office, the team leaves one cushion free for whoever arrives next. You have made a place to return to.&#x27;],advice:[&#x27;An adventure that ends with a welcome is a good adventure.&#x27;,&#x27;Nobody has to bring a perfect story to sit with us.&#x27;,&#x27;That bridge will be easy to find after dark.&#x27;,&#x27;Let’s keep the reading lamp on.&#x27;,&#x27;And the spare cushion. I solemnly promise not to claim it.&#x27;],choices:[]},
    gardenEnding:{chapter:4,title:&#x27;The Garden of Next Chapters&#x27;,ending:&#x27;garden&#x27;,text:[&#x27;You place the lantern in a patch of soft earth. By morning, its light has grown into an enormous tree with reading nooks among the branches. Every leaf carries the beginning of a different story.&#x27;,&#x27;Neighbors arrive with watering cans, blankets and tales. Luna helps care for the roots while the rest of you make room on a long bench. You have grown a place where people can stay.&#x27;],advice:[&#x27;There are so many first pages waiting in that tree.&#x27;,&#x27;Let’s make the bench wide enough for everyone.&#x27;,&#x27;I can build a little path that is easy to follow.&#x27;,&#x27;I will take the first watering turn.&#x27;,&#x27;I have found the perfect branch for a very small picnic.&#x27;],choices:[]},
    journeyEnding:{chapter:4,title:&#x27;The Road Beyond the Last Page&#x27;,ending:&#x27;journey&#x27;,text:[&#x27;You lift the lantern toward the horizon. A road unfolds across the sky, lined with signs pointing to places that do not yet have names. The library grows wheels and gives an experimental, delighted creak.&#x27;,&#x27;The keeper brings the books. The team packs cushions, tea and an empty notebook. You leave a light in the office window so you can always find your way back. Your next chapter is waiting.&#x27;],advice:[&#x27;A library on wheels! This is exactly my kind of ending.&#x27;,&#x27;We should write to everyone we meet along the way.&#x27;,&#x27;I checked the wheels. Imaginary wheels, excellent condition.&#x27;,&#x27;I am bringing a little plant for the journey.&#x27;,&#x27;And I am bringing the snacks. We have established our priorities.&#x27;],choices:[]},
    festivalEnding:{chapter:4,title:&#x27;The Night the City Told Its Stories&#x27;,ending:&#x27;festival&#x27;,text:[&#x27;You raise the lantern above the square. Invitations drift into open windows, and neighbors follow its light with chairs, instruments and stories of their own. The library spills gently into the streets.&#x27;,&#x27;Someone tells a funny tale; someone else shares a quiet one. There is room for both. At dawn, the team walks home with you beneath a sky that seems to have gained a few new stars. You have brought people together.&#x27;],advice:[&#x27;Did you hear the story about the very stubborn cloud?&#x27;,&#x27;My favorite part was how everyone listened to the quiet story too.&#x27;,&#x27;We could make this a tradition.&#x27;,&#x27;I put flowers on the storytellers’ table.&#x27;,&#x27;I laughed so much I nearly dropped my biscuit. Worth it.&#x27;],choices:[]}
  };
  const endingNames={home:&#x27;Welcome home&#x27;,garden:&#x27;Story garden&#x27;,journey:&#x27;A new journey&#x27;,festival:&#x27;Lantern festival&#x27;};
  let sceneId=&#x27;invitation&#x27;,inventory=new Set(),route=[],endings=new Set(),open=false,locked=false,unlockTimer=0,disposed=false,readRequest=&#x27;&#x27;;
  let storageWorks=true,lastKey=&#x27;&#x27;;
  const available=choice=&gt;!choice.any||choice.any.some(item=&gt;inventory.has(item));

    lastKey=&#x27;&#x27;;sync();

  function choose(from,id){

&lt;script data-office-wish-cycle-engine&gt;
(() =&gt; {
  const root=document.getElementById(&#x27;little-office-v4&#x27;);if(!root)return;

    const names=Object.keys(defaults),key=&#x27;little-office-wish-cycle-v1&#x27;;
    const clean=(s,max=350)=&gt;typeof s===&#x27;string&#x27;?s.trim().slice(0,max):&#x27;&#x27;;
    const copy=x=&gt;JSON.parse(JSON.stringify(x));
    let current={...defaults},pending=null,history=[],completed=[],rejected=[],revision=0,rendered=&#x27;&#x27;,hydrating=true;
    let result={};try{result=JSON.parse(root.querySelector(&#x27;#little-office-v4-result-data&#x27;).textContent);}catch(_){}
    const active=()=&gt;[&#x27;demo&#x27;,&#x27;sending&#x27;,&#x27;working&#x27;,&#x27;paused&#x27;,&#x27;waiting&#x27;].includes(root.officeState.phase);
